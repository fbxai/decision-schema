<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="diamondBackground">
      <path d="M 256,101 L 411,256 L 256,411 L 101,256 Z" />
    </clipPath>

    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#14192b" />
      <stop offset="100%" stop-color="#0a0c14" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="primaryCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#e100ff" />
    </linearGradient>

    <linearGradient id="scoreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#9b51e0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Keep the original background gradient inside the decision diamond. -->
  <rect width="512" height="512" fill="url(#bgGlow)" clip-path="url(#diamondBackground)" />

  <!-- Outer Isometric Decision Diamond (Base Structure) -->
  <g transform="translate(256, 256)">
    <!-- Ambient Schema Diamond Backing -->
    <path d="M 0,-180 L 180,0 L 0,180 L -180,0 Z" fill="none" stroke="url(#primaryCyan)" stroke-width="3" stroke-dasharray="8 6" opacity="0.35" />

    <!-- Decision Diamond Frame -->
    <path d="M 0,-155 L 155,0 L 0,155 L -155,0 Z" fill="#0c1122" fill-opacity="0.75" stroke="url(#primaryCyan)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)" />

    <!-- Predicate / Rule Matrix Grid Overlay -->
    <path d="M -80,-75 L 80,75 M -80,75 L 80,-75" stroke="rgba(0, 210, 255, 0.12)" stroke-width="2" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="rgba(127, 0, 255, 0.15)" stroke-width="1.5" stroke-dasharray="4 8" />

    <!-- LEFT: Schema Curly Bracket { (Code / Structured Schema) -->
    <path d="M -75,-62 C -92,-62 -95,-48 -95,-28 C -95,-12 -104,-5 -114,0 C -104,5 -95,12 -95,28 C -95,48 -92,62 -75,62" fill="none" stroke="url(#neonCyan)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />

    <!-- RIGHT: Schema Curly Bracket } -->
    <path d="M 75,-62 C 92,-62 95,-48 95,-28 C 95,-12 104,-5 114,0 C 104,5 95,12 95,28 C 95,48 92,62 75,62" fill="none" stroke="url(#neonCyan)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />

    <!-- CENTER-TOP & ARMS: Decision Tree / Predicate Branching Network -->
    <!-- Root Inflow -->
    <path d="M 0,-115 L 0,-60" fill="none" stroke="url(#neonCyan)" stroke-width="5" stroke-linecap="round" />
    <circle cx="0" cy="-115" r="5" fill="#00f2fe" filter="url(#glow)" />

    <!-- Choice 1 Branch (Left Path: Predicate Evaluation) -->
    <path d="M 0,-60 Q -50,-60 -50,-10" fill="none" stroke="url(#neonCyan)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Choice 2 Branch (Right Path: Alternative Option) -->
    <path d="M 0,-60 Q 50,-60 50,-10" fill="none" stroke="url(#accentPurple)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Decision Center Node (Predicate Hub) -->
    <circle cx="0" cy="-60" r="8" fill="#14192b" stroke="#00f2fe" stroke-width="4" filter="url(#glow)" />
    <circle cx="0" cy="-60" r="3" fill="#ffffff" />

    <!-- Left Option Node (Choice A) -->
    <circle cx="-50" cy="-10" r="6" fill="#14192b" stroke="#00f2fe" stroke-width="3" />
    <circle cx="-50" cy="-10" r="2.5" fill="#38ef7d" />

    <!-- Right Option Node (Choice B) -->
    <circle cx="50" cy="-10" r="6" fill="#14192b" stroke="#e100ff" stroke-width="3" />
    <circle cx="50" cy="-10" r="2.5" fill="#e100ff" />

    <!-- Converging Vectors into Score / Evaluation Metric (Bottom Axis) -->
    <path d="M -50,-4 L -50,25 Q -50,55 0,72" fill="none" stroke="url(#neonCyan)" stroke-width="3.5" stroke-dasharray="5 4" />
    <path d="M 50,-4 L 50,25 Q 50,55 0,72" fill="none" stroke="url(#accentPurple)" stroke-width="3.5" stroke-dasharray="5 4" />

    <!-- Direct Score Output Vector Beam -->
    <path d="M 0,-52 L 0,65" fill="none" stroke="url(#scoreGlow)" stroke-width="4" stroke-linecap="round" />

    <!-- FINAL EVALUATION / SCORE METRIC BADGE (Bottom Diamond) -->
    <g transform="translate(0, 85)">
      <!-- Outer Pulsing Halo -->
      <polygon points="0,-22 22,0 0,22 -22,0" fill="url(#scoreGlow)" opacity="0.3" filter="url(#softGlow)" />
      <!-- Solid Inner Score Token -->
      <polygon points="0,-16 16,0 0,16 -16,0" fill="#0c1122" stroke="url(#scoreGlow)" stroke-width="3.5" filter="url(#glow)" />
      <!-- High Confidence Core Point -->
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>

    <!-- Structural Indicator Guides (Schema Coordinate Marks) -->
    <line x1="-140" y1="0" x2="-125" y2="0" stroke="rgba(0, 242, 254, 0.4)" stroke-width="2" stroke-linecap="round" />
    <line x1="125" y1="0" x2="140" y2="0" stroke="rgba(0, 242, 254, 0.4)" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="-140" x2="0" y2="-125" stroke="rgba(0, 242, 254, 0.4)" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="125" x2="0" y2="140" stroke="rgba(0, 242, 254, 0.4)" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
